<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Deci: allow device access</title>
  <link rel="icon" href="icons/icon32.png">
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #d2d2d7;
      --accent: #4688f1;
      --accent-text: #ffffff;
      --error: #c4301c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --card: #2c2c2e;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --border: #3a3a3c;
        --accent: #5b9bff;
        --accent-text: #0b0b0c;
        --error: #ff6b5a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    main {
      width: 100%;
      max-width: 30rem;
      padding: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    img { display: block; margin-bottom: 12px; }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
    p { margin: 0 0 10px; }
    .muted { color: var(--muted); font-size: 13px; }
    #status { margin-top: 18px; font-weight: 500; }
    #error-reason { color: var(--error); }
    button {
      margin-top: 6px;
      padding: 7px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon48.png" alt="" width="48" height="48">
    <h1>Allow device access</h1>
    <p>Deci needs this once to play Chrome tabs on other speakers and headphones.</p>
    <p class="muted">Chrome calls it microphone access because that same permission is what reveals speaker names.</p>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="error" hidden>
      <p id="error-reason"></p>
      <p>Deci only uses this permission to read speaker names. No audio is ever recorded.</p>
      <button id="retry" type="button">Try again</button>
    </div>
  </main>
  <script src="permissions.js"></script>
</body>
</html>
